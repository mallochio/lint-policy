[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "D",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "ERA",
    "FURB",
    "PERF",
    "DTZ",
    "PIE",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF",
    "PGH",
]
ignore = ["E501", "PLR0913", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG001", "D"]

[tool.complexipy]
paths = ["src"]
max-complexity-allowed = 20
sort = "desc"
exclude = ["tests/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.docvet]
exclude = ["tests", "scripts"]
fail-on = ["freshness"]
